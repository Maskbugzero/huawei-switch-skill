[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "huawei-switch-skill"
version = "0.4.0"
description = "Huawei VRP switch automation skill (Console primary, SSH batch ops)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Maskbugzero" }]
keywords = ["huawei", "vrp", "switch", "console", "network-automation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Networking",
]
dependencies = [
  "pyserial>=3.5",
  "jinja2>=3.1.0",
  "pyyaml>=6.0",
  "pydantic>=2.0",
  "paramiko>=2.0",
  "netmiko>=4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
]

[project.urls]
Homepage = "https://github.com/Maskbugzero/huawei-switch-skill"
Changelog = "https://github.com/Maskbugzero/huawei-switch-skill/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
